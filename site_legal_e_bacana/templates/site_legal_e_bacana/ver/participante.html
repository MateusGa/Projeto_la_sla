{% extends "site_legal_e_bacana/modelo.html" %}

{% block conteudo %}

<div class="container">

    <h1>{{ object.Participante_nome }}</h1>

    <hr>

    <p>
        <strong>Email:</strong>
        {{ object.Participante_email }}
    </p>

    <p>
        <strong>Senha:</strong>
        {{ object.Participante_senha }}
    </p>

    <a href="{% url 'participantes_listar' %}" class="btn btn-primary">
        Voltar
    </a>

</div>

{% endblock conteudo %}
