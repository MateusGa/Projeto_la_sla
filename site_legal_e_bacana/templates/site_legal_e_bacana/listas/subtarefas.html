{% extends "site_legal_e_bacana/modelo.html" %}
{% load static %}

{% block conteudo %}

<div class="container">

<h1 id="titulo">LISTA DE SUBTAREFAS</h1>


<table class="table table-striped table-hover comic" style="margin-top: 20px;">

    <thead>
        <tr>
            <th>Nome</th>
            <th>Ações</th>
        </tr>
    </thead>

    <tbody>

    {% for subtarefa in object_list %}
        <tr>

            <td>{{ subtarefa.Subtarefa_nome }}</td>

            <td>
                <a class="comic linhazinha" href="{% url "subtarefas_ver" subtarefa.pk %}">Ver</a> &emsp;

                <a class="comic linhazinha" href="{% url "subtarefas_update" subtarefa.pk %}">
                    Corrigir seus Erros
                </a> &emsp;

                <a class="comic linhazinha" href="{% url "subtarefas_delete" subtarefa.pk %}">
                    APAGAR
                </a>
            </td>


        </tr>
    {% endfor %}

    </tbody>

</table>

 <a class="comic linhazinha" href="{% url 'subtarefas_create' %}" style="border: 2px solid #00aeff; font-size: 30px">Criar</a> &emsp;

</div>

<script>
function corAleatoria() {
    let r = Math.floor(Math.random()*256);
    let g = Math.floor(Math.random()*256);
    let b = Math.floor(Math.random()*256);
    return `rgb(${r},${g},${b})`;
}

document.getElementById("titulo").style.color = corAleatoria();
</script>

{% endblock conteudo %}
