{% extends "site_legal_e_bacana/modelo.html" %}
{% load static %}

{% block conteudo %}

<style>
h1{
    font-family: Comic Sans MS;
}
</style>

<div class="container">

<h1 id="titulo">LISTA DE ANEXOS</h1>

<p>A LISTA DE ANEXOS</p>

<table class="table table-striped table-hover comic">

    <thead>
        <tr>
            <th>Nome</th>
            <th>Ações</th>
        </tr>
    </thead>

    <tbody>

    {% for anexo in object_list %}
        <tr>

            <td>{{ anexo.Anexo_nome }}</td>

            <td>
                <a class="comic linhazinha" href="{% url "anexos_ver" anexo.pk %}">Ver</a> &emsp;

                <a class="comic linhazinha" href="{% url "anexos_update" anexo.pk %}">
                    Corrigir seus Erros
                </a> &emsp;

                <a class="comic linhazinha" href="{% url "anexos_delete" anexo.pk %}">
                    APAGAR
                </a>
            </td>

        </tr>
    {% endfor %}

    </tbody>

</table>

</div>

<script>
function corAleatoria() {
    let r = Math.floor(Math.random()*256);
    let g = Math.floor(Math.random()*256);
    let b = Math.floor(Math.random()*256);
    return `rgb(${r},${g},${b})`;
}

document.getElementById("titulo").style.color = corAleatoria();
</script>

{% endblock conteudo %}
