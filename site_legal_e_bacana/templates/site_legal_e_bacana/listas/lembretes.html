{% extends "site_legal_e_bacana/modelo.html" %}
{% load static %}

{% block conteudo %}

<style>
h1{
    font-family: Comic Sans MS;
    margin-top: 30px;
}
</style>

<div class="container">

<h1 id="titulo">LISTA DE LEMBRETES</h1>



<table class="table table-striped table-hover comic" style="margin-top: 20px;">

    <thead>
        <tr>
            <th>Nome</th>
            <th>Ações</th>
        </tr>
    </thead>

    <tbody>

    {% for lembrete in object_list %}
        <tr>

            <td>{{ lembrete.Lembrete_nome }}</td>

            <td>
                <a class="comic linhazinha" href="{% url "lembretes_ver" lembrete.pk %}">Ver</a> &emsp;

                <a class="comic linhazinha" href="{% url "lembretes_update" lembrete.pk %}">
                    Corrigir seus Erros
                </a> &emsp;

                <a class="comic linhazinha" href="{% url "lembretes_delete" lembrete.pk %}">
                    APAGAR
                </a>
            </td>

        </tr>
    {% endfor %}

    </tbody>

</table>

 <a class="comic linhazinha" href="{% url 'lembretes_create' %}" style="border: 2px solid #00aeff; font-size: 30px">Criar</a> &emsp;

</div>

<script>
function corAleatoria() {
    let r = Math.floor(Math.random()*256);
    let g = Math.floor(Math.random()*256);
    let b = Math.floor(Math.random()*256);
    return `rgb(${r},${g},${b})`;
}

document.getElementById("titulo").style.color = corAleatoria();
</script>

{% endblock conteudo %}
