{% extends "site_legal_e_bacana/modelo.html" %}
{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    {%block conteudo%}
     <style>
     h1{
            font-family: Comic Sans MS;
        }
    </style>

    <h1 id="titulo">LISTA DE EVENTOS</h1>

    <p>A LSITA DE EVENTOS</p>



    <table class = "table table-striped table hover">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Ações</th>
            </tr>
        </thead>


        {% for evento in object_list%}
        <tr>

            <td> {{ evento.Evento_nome}} </td>

            <td>
                <a href="{% url "eventos_ver" evento.pk %}">Ver</a> &emsp;

                <a href="{% url "eventos_update" evento.pk %}">Corrigir seus Erros</a> &emsp;

                <a href="{% url "eventos_delete" evento.pk %}">APGAGAR</a> &emsp;

            </td>

        {%endfor%}




     <script>
function corAleatoria() {
    let r = Math.floor(Math.random()*256);
    let g = Math.floor(Math.random()*256);
    let b = Math.floor(Math.random()*256);
    return `rgb(${r},${g},${b})`;
}

document.getElementById("titulo").style.color = corAleatoria();
</script>
    {%endblock conteudo%}
</body>
</html>
